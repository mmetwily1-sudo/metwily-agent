name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npx -y typescript@5.6 --noEmit -p tsconfig.base.json || echo "tsc check (non-blocking v0.1)"
